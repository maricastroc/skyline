app = "skyline-renderer"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "renderer/Dockerfile"

[env]
  PORT = "8080"
  SKYLINE_RENDERER_CONCURRENCY = "2"
  SKYLINE_RENDERER_QUEUE = "4"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 6
    hard_limit = 12

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
